[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirects for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive immutable caching for bundled static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
